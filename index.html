<!DOCTYPE html>
<html>
    <head>
        <title>
            My presentation app
        </title>
        <link rel="stylesheet" href="main.css">
        <script src="script.js" defer></script>
    </head>
    
    <body>
        <h1 id="main-heading">
            Welcome to Presentation app
        </h1>
    <div class="Buttons">
        <button id="Create-slides"> Create </button>
        <button id="Edit-slides"> Edit </button>
        <button id="Save-slides"> Save </button>
        <button id="Present-slides"> Present </button>
    </div>
    <div class="write-display">
        <textarea name="text-area" id="text-area"></textarea>
        <div id="display-class" class="display-class"> 
            <div class="display-presentation" id="display-presentation"></div>
             <p id="counter" ></p>
            <div class="bottom-buttons">
                <button id="Left"> Left </button>
                <button id="Full-Screen"> Full Screen </button>
                <button id="Right"> Right </button>
            </div>
         </div>
    </div>    
    </body>
</html>
